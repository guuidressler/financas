<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Finanças</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #1b2433; --muted: #6b7585; --line: #e3e7ee;
    --brand: #1f3864; --brand-2: #2f5597; --ok: #1e8a4c; --bad: #c0392b; --chip: #e8edf6;
    --c-ent: #2e9e62; --c-des: #d9644f; --c-acc: #2f5597; --hdr: #1f3864; --hdr-chip: rgba(255,255,255,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141c; --card: #171e2a; --ink: #e8edf5; --muted: #98a2b3; --line: #273142;
      --brand: #8fb0ff; --brand-2: #6d93f0; --ok: #4cc38a; --bad: #ff7b6b; --chip: #212b3b;
      --c-ent: #4cc38a; --c-des: #ff8a73; --c-acc: #7fa3f5; --hdr: #1a2740; --hdr-chip: rgba(255,255,255,.07); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink); padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  button { font: inherit; cursor: pointer; }
  header { background: var(--hdr); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 12px; }
  .hd-wrap { max-width: 560px; margin: 0 auto; }
  .hd-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mesnav { display: flex; align-items: center; gap: 6px; }
  .mesnav button { border: 0; background: var(--hdr-chip); color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; }
  .mesnav .nm { font-weight: 700; font-size: 15px; min-width: 118px; text-align: center; cursor: pointer; }
  .mesnav .nm small { display: block; font-size: 10.5px; font-weight: 600; opacity: .75; }
  .gear { border: 0; background: var(--hdr-chip); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 17px; }
  .sobra { margin-top: 10px; }
  .sobra .lb { font-size: 12px; opacity: .8; text-transform: uppercase; letter-spacing: .04em; }
  .sobra .vl { font-size: 30px; font-weight: 800; line-height: 1.15; }
  .sobra .vl.neg { color: #ffb3a6; }
  .eqwrap { display: flex; flex-direction: column; }
  .eqwrap .sobra { order: -1; }
  .opeq { display: none; }
  .hgrid { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 4px; margin-top: 10px; align-items: center; }
  .op { font-size: 18px; font-weight: 700; opacity: .85; text-align: center; padding: 0 1px; }
  @media (max-width: 959px) {
    .hgrid { gap: 3px; }
    .hgrid button { padding: 7px 6px; }
    .hgrid b { font-size: 13px; }
    .op { font-size: 15px; }
  }
  .hgrid button { border: 0; text-align: left; background: var(--hdr-chip); color: #fff; border-radius: 10px; padding: 7px 9px; min-width: 0; }
  .hgrid small { display: block; font-size: 10.5px; opacity: .78; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hgrid b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hnote { font-size: 12px; opacity: .8; margin-top: 8px; }
  main { padding: 12px 16px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 9px 2px; border-radius: 8px; font-weight: 600; color: var(--muted); font-size: 13px; }
  .seg button.on { background: var(--card); color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  input, select { width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); appearance: none; -webkit-appearance: none; font-family: inherit; }
  input:focus, select:focus { outline: 2px solid var(--brand-2); border-color: transparent; }
  .valor { font-size: 30px; font-weight: 700; text-align: center; padding: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 10px; }
  .toggle span { font-weight: 600; }
  .sw { position: relative; width: 50px; height: 30px; flex: none; margin: 0 !important; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw i { position: absolute; inset: 0; background: var(--line); border-radius: 30px; transition: .2s; }
  .sw i:before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .sw input:checked + i { background: var(--ok); }
  .sw input:checked + i:before { transform: translateX(20px); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 17px; font-weight: 700; background: var(--brand); color: #fff; margin-top: 16px; }
  @media (prefers-color-scheme: dark) { .btn { background: var(--brand-2); color: #0f141c; } }
  .btn:disabled { opacity: .55; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btnrow button { flex: 1 1 auto; border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 700; font-size: 14px; background: var(--chip); color: var(--brand); }
  .btnrow button.pri { background: var(--brand); color: #fff; }
  @media (prefers-color-scheme: dark) { .btnrow button.pri { background: var(--brand-2); color: #0f141c; } }
  .btnrow button.dang { background: transparent; color: var(--bad); border: 1px solid var(--line); }
  .hidden { display: none !important; }
  .loading { text-align: center; color: var(--muted); padding: 30px 0; }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; cursor: pointer; }
  .item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 12px; color: var(--muted); }
  .item .v { font-weight: 700; text-align: right; white-space: nowrap; }
  .item .v small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .item.prev { opacity: .6; }
  .rec { color: var(--ok); } .neg { color: var(--bad); } .pos { color: var(--ok); }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; background: transparent; padding: 0; }
  .dot.on { background: var(--ok); border-color: var(--ok); }
  .lnk { border: 0; background: transparent; color: var(--bad); font-size: 13px; font-weight: 700; padding: 6px 4px; flex: none; }
  .grp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .grp-h h3 { margin: 0; }
  .grp-h b { font-size: 15px; white-space: nowrap; }
  .grp-sub { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
  .cardsub { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 0 2px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .cardsub button { border: 0; background: var(--chip); color: var(--brand); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 12px; }
  .rowv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; gap: 10px; }
  .rowv:last-child { border-bottom: 0; }
  .rowv b { white-space: nowrap; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .kpi small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
  .kpi b { font-size: 16px; white-space: nowrap; display: block; overflow: hidden; text-overflow: ellipsis; }
  .prog { height: 12px; background: var(--chip); border-radius: 12px; overflow: hidden; margin: 8px 0 4px; }
  .prog i { display: block; height: 100%; background: var(--c-ent); border-radius: 12px; }
  .bar { margin: 9px 0; }
  .bar .top { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; }
  .bar .top span:last-child { font-weight: 700; white-space: nowrap; }
  .bar .track { height: 7px; background: var(--chip); border-radius: 7px; overflow: hidden; margin-top: 4px; }
  .bar .fill { height: 100%; background: var(--c-acc); border-radius: 7px; }
  .bar .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; background: var(--chip); color: var(--brand); border-radius: 6px; padding: 2px 6px; margin-right: 4px; }
  .split { display: flex; gap: 8px; margin-top: 8px; }
  .split > div { flex: 1; background: var(--chip); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .split b { display: block; font-size: 15px; color: var(--ink); white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 20px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .chips button.on { background: var(--brand); color: #fff; border-color: transparent; }
  @media (prefers-color-scheme: dark) { .chips button.on { background: var(--brand-2); color: #0f141c; } }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { font-size: 10px; fill: var(--muted); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  table.mt { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  table.mt th, table.mt td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.mt th:first-child, table.mt td:first-child { text-align: left; }
  table.mt th { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .tw { overflow-x: auto; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { border: 0; background: transparent; padding: 10px 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
  nav button.on { color: var(--brand); }
  nav svg { display: block; margin: 0 auto 3px; }
  .ovl { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .sheet .hd h2 { margin: 0; font-size: 19px; }
  .sheet .x { border: 0; background: var(--chip); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; font-size: 16px; flex: none; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom)); background: #111a28; color: #fff; padding: 13px 14px;
    border-radius: 12px; font-size: 15px; opacity: 0; visibility: hidden; transform: translateY(20px); transition: .25s; z-index: 30; max-width: 528px; margin: 0 auto; }
  .toast.show { transform: none; opacity: 1; visibility: visible; }
  .toast.err { background: var(--bad); }
  /* Fatura por cartão */
  .fat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0 4px; }
  .fat-h { display: flex; align-items: center; gap: 10px; }
  .fat-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; flex: none; }
  .fat-h .nm { flex: 1; min-width: 0; font-weight: 700; }
  .fat-h .nm small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .fat-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12px; color: var(--muted); margin: 8px 0; padding: 8px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
  .fat-meta b { display: block; color: var(--ink); font-size: 13px; }
  .fat-meta > div:last-child { text-align: right; }
  .fat-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 9px; color: #fff; }
  .b-aberta { background: var(--c-acc); } .b-fechada { background: var(--bad); } .b-paga { background: var(--ok); }
  .fat-f button { border: 0; background: transparent; color: var(--brand); font-weight: 700; font-size: 13px; padding: 4px 0; }
  details.fat-l summary { cursor: pointer; font-size: 13px; color: var(--brand); font-weight: 600; margin-top: 6px; list-style: none; }
  details.fat-l summary::-webkit-details-marker { display: none; }
  /* Orçamento */
  .orc { margin: 12px 0; }
  .orc .top { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; }
  .orc .top b { white-space: nowrap; }
  .orc .trk { position: relative; height: 9px; background: var(--chip); border-radius: 9px; margin-top: 5px; }
  .orc .trk i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; }
  .orc .trk u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; text-decoration: none; }
  .orc .sub { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 3px; }
  /* Rosca */
  .donut { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .donut svg { width: 150px; height: 150px; flex: none; }
  .donut ul { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 150px; font-size: 13px; }
  .donut li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .donut li i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .donut li span:last-child { color: var(--muted); white-space: nowrap; }
  .nav-brand { display: none; }
  /* Computador: menu lateral e cartões em colunas */
  @media (min-width: 960px) {
    body { padding-bottom: 0; padding-left: 92px; }
    nav { top: 0; right: auto; width: 92px; grid-template-columns: 1fr; grid-auto-rows: min-content; gap: 4px;
      border-top: 0; border-right: 1px solid var(--line); padding: 14px 0 0; }
    nav button { border-radius: 12px; margin: 0 8px; padding: 10px 0; }
    nav button.on { background: var(--chip); }
    .nav-brand { display: block; text-align: center; font-weight: 800; color: var(--brand); font-size: 13px; padding: 4px 0 12px; }
    header { padding: 18px 28px 16px; }
    .hd-wrap, main { max-width: 1240px; }
    .hd-wrap { display: grid; grid-template-columns: 1fr auto minmax(280px, 380px); column-gap: 22px; align-items: center;
      grid-template-areas: ". . nav" "eq op res" ". . note"; }
    .hd-row { grid-area: nav; }
    .eqwrap { display: contents; }
    .hgrid { grid-area: eq; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; margin-top: 0; }
    .op { font-size: 30px; font-weight: 300; }
    .opeq { display: block; grid-area: op; font-size: 40px; }
    .eqwrap .sobra { grid-area: res; margin-top: 6px; }
    .hnote { grid-area: note; }
    .sobra .vl { font-size: 36px; }
    .hgrid button { padding: 10px 12px; }
    .hgrid b { font-size: 16px; }
    main { padding: 20px 28px; }
    #tabLancar { max-width: 620px; margin: 0 auto; }
    #hist, #inv, #painel, #esp { columns: 2; column-gap: 16px; }
    #hist > *, #inv > *, #painel > *, #esp > * { break-inside: avoid; }
    #segPessoa { max-width: 420px; }
    .ovl { align-items: center; }
    .sheet { border-radius: 18px; max-height: 88vh; }
    .toast { left: 108px; bottom: 24px; }
  }
  @media (min-width: 1400px) { #hist, #painel { columns: 3; } }
</style>
</head>
<body>
<header>
  <div class="hd-wrap">
    <div class="hd-row">
      <div class="mesnav">
        <button id="mPrev" aria-label="Mês anterior">‹</button>
        <div class="nm" id="hMes"><span id="hMesT">…</span><small id="hMesSub"></small></div>
        <button id="mNext" aria-label="Próximo mês">›</button>
      </div>
      <button class="gear" id="btnCfg" aria-label="Configurações">⚙</button>
    </div>
    <div class="eqwrap">
      <div class="hgrid">
        <button data-ir="hist-entradas"><small>Entradas</small><b id="hEnt">–</b></button>
        <span class="op">+</span>
        <button data-ir="hist-mariana"><small id="hMarLb">Mariana</small><b id="hMar">–</b></button>
        <span class="op">−</span>
        <button data-ir="hist-saidas"><small>Saídas</small><b id="hSai">–</b></button>
      </div>
      <span class="op opeq">=</span>
      <div class="sobra"><div class="lb">Sobra do salário</div><div class="vl" id="hSobra">R$ –</div></div>
    </div>
    <div class="hnote" id="hNote"></div>
  </div>
</header>

<main>
  <section id="tabLancar">
    <div class="card">
      <div class="seg" id="segTipo">
        <button data-v="Despesa" class="on">Despesa</button>
        <button data-v="Receita">Receita</button>
        <button data-v="Desconto">Desconto</button>
        <button data-v="Acerto" class="nmEsp">Mariana</button>
      </div>
      <label for="fValor">Valor (R$)</label>
      <input id="fValor" class="valor moeda" inputmode="numeric" placeholder="0,00" autocomplete="off">
      <label for="fDesc">Descrição</label>
      <input id="fDesc" list="dlDesc" placeholder="Ex.: Bistek" autocomplete="off">
      <datalist id="dlDesc"></datalist>
      <div class="two">
        <div id="boxCat"><label for="fCat">Categoria</label><select id="fCat"></select></div>
        <div><label for="fMeio">Pagamento</label><select id="fMeio"></select></div>
      </div>
      <div class="two">
        <div><label for="fData">Data</label><input id="fData" type="date"></div>
        <div id="boxParc"><label for="fParc">Parcelas</label><input id="fParc" type="number" inputmode="numeric" min="1" max="48" value="1"></div>
      </div>
      <div id="boxModo" class="hidden">
        <label for="fModo">O valor informado é</label>
        <select id="fModo"><option value="parcela">Valor de cada parcela</option><option value="total">Valor total da compra</option></select>
      </div>
      <div id="boxMar">
        <div class="toggle"><span>Dividir com a <span class="nmEsp">Mariana</span></span><label class="sw"><input type="checkbox" id="fDiv"><i></i></label></div>
        <div id="boxPct" class="hidden"><label for="fPct">Parte dela (%)</label><input id="fPct" type="number" inputmode="numeric" min="1" max="100" value="50"></div>
      </div>
      <div id="boxRep">
        <div class="toggle"><span>Repetir todo mês</span><label class="sw"><input type="checkbox" id="fRep"><i></i></label></div>
      </div>
      <div class="hint" id="hint"></div>
      <button class="btn" id="btnSalvar">Salvar lançamento</button>
    </div>
    <div class="hint" id="ultimo" style="text-align:center"></div>
  </section>

  <section id="tabHist" class="hidden"><div id="hist"><div class="loading">Carregando…</div></div></section>

  <section id="tabInv" class="hidden">
    <div class="seg" id="segPessoa" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
      <button data-p="eu" class="on">Você</button><button data-p="esposa" class="nmEsp">Mariana</button>
    </div>
    <div id="inv"><div class="loading">Carregando…</div></div>
  </section>

  <section id="tabEsposa" class="hidden"><div id="esp"><div class="loading">Carregando…</div></div></section>

  <section id="tabPainel" class="hidden">
    <div class="card">
      <h3>Período</h3>
      <div class="chips" id="chipsPer">
        <button data-per="3">3 meses</button><button data-per="6" class="on">6 meses</button><button data-per="12">12 meses</button>
        <button data-per="ano">Este ano</button><button data-per="livre">Escolher</button>
      </div>
      <div id="boxLivre" class="hidden">
        <div class="two"><div><label for="pDe">De</label><input id="pDe" type="month"></div><div><label for="pAte">Até</label><input id="pAte" type="month"></div></div>
        <div class="btnrow"><button class="pri" id="pAplicar">Aplicar</button></div>
      </div>
    </div>
    <div id="painel"><div class="loading">Carregando…</div></div>
  </section>
</main>

<nav>
  <div class="nav-brand">Finanças</div>
  <button data-tab="lancar" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Lançar</button>
  <button data-tab="hist"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Histórico</button>
  <button data-tab="inv"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Investimentos</button>
  <button data-tab="painel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Painel</button>
</nav>
<div class="toast" id="toast"></div>
<div class="ovl hidden" id="ovl"><div class="sheet" id="sheet"></div></div>

<script>
  const S = { tipo: 'Despesa', init: null, mes: null, mesFoco: null, mesHoje: null, resumo: null, aba: 'lancar',
              inv: null, pessoa: 'eu', per: { tipo: '6' }, recs: null, movs: null, ativoAtual: null, movsTodas: null, filtroMov: 'todas', movTudo: false };
  const $ = id => document.getElementById(id);
  const fmt = v => (v < 0 ? '-' : '') + 'R$ ' + Math.abs(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt0 = v => (v < 0 ? '-' : '') + 'R$ ' + Math.abs(Math.round(v || 0)).toLocaleString('pt-BR');
  const num2 = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const mesNome = iso => { const [y, m] = iso.split('-').map(Number); return MESES[m - 1] + ' de ' + y; };
  const mesCurto = iso => { const [y, m] = iso.split('-').map(Number); return MESES[m - 1].slice(0, 3) + '/' + y; };
  const addMes = (iso, k) => { const [y, m] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + k, 1));
    return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-01'; };
  const dataBr = iso => iso ? iso.split('-').reverse().join('/') : '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const esp = () => (S.init && S.init.esposa) || 'Mariana';
  const ehCartao = x => String(x.meio).indexOf('Cartão') === 0;
  const ehBolsa = t => t === 'Ação' || t === 'FII';
  const COR_CAT = ['#2f6fdb', '#8a4fd6', '#f2a516', '#18a6b8', '#e2574c', '#3fae5a', '#6b7585'];
  // Gráfico de rosca: top 5 + "Demais"
  function donut(lista) {
    const pos = lista.filter(c => c.valor > 0).sort((a, b) => b.valor - a.valor);
    const top = pos.slice(0, 5), resto = pos.slice(5).reduce((s, c) => s + c.valor, 0);
    if (resto > 0) top.push({ nome: 'Demais', valor: resto });
    const tot = top.reduce((s, c) => s + c.valor, 0); if (!tot) return '<div class="hint">Sem gastos.</div>';
    const R = 52, C = 2 * Math.PI * R; let acc = 0, arcs = '';
    top.forEach((c, i) => { const f = c.valor / tot;
      arcs += `<circle r="${R}" cx="75" cy="75" fill="none" stroke="${COR_CAT[i % COR_CAT.length]}" stroke-width="22" stroke-dasharray="${f * C} ${C}" stroke-dashoffset="${-acc * C}" transform="rotate(-90 75 75)"><title>${esc(c.nome)} ${fmt(c.valor)}</title></circle>`; acc += f; });
    return `<div class="donut"><svg viewBox="0 0 150 150" role="img">${arcs}<text x="75" y="72" text-anchor="middle" style="font-size:10px;fill:var(--muted)">total</text>
      <text x="75" y="88" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--ink)">${esc(fmt0(tot))}</text></svg>
      <ul>${top.map((c, i) => `<li><span><i style="background:${COR_CAT[i % COR_CAT.length]}"></i>${esc(c.nome)}</span><span>${Math.round(c.valor / tot * 100)}%</span></li>`).join('')}</ul></div>`;
  }

  function toast(msg, erro) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (erro ? ' err' : '');
    clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3400);
  }
  function abrirModal(html) { $('sheet').innerHTML = html; $('ovl').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
  function fecharModal() { $('ovl').classList.add('hidden'); $('sheet').innerHTML = ''; document.body.style.overflow = ''; }
  const hd = t => `<div class="hd"><h2>${esc(t)}</h2><button class="x" onclick="fecharModal()" aria-label="Fechar">✕</button></div>`;

  // Dinheiro estilo app de banco: digita só números, a vírgula entra sozinha (1234 -> 12,34)
  document.addEventListener('input', e => {
    const el = e.target;
    if (!el.classList || !el.classList.contains('moeda')) return;
    const d = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
    el.value = d ? num2(parseInt(d, 10) / 100) : '';
  });
  function parseValor(s) {
    s = String(s || '').trim().replace(/[R$\s]/g, '');
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    return Number(s);
  }
  function preencherSelect(sel, itens, valor) { sel.innerHTML = itens.map(i => `<option${i === valor ? ' selected' : ''}>${esc(i)}</option>`).join(''); }

  // ---------- Conexão com a ponte ----------
  const CFG_KEY = 'financas.cfg.v1';
  function lerCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { return null; } }
  function salvarCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); return true; } catch (e) { return false; } }
  async function run(fn, ...args) {
    const cfg = lerCfg();
    if (!cfg || !cfg.url || !cfg.chave) { telaConexao(); throw new Error('Configure o app primeiro.'); }
    let resp;
    try {
      resp = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ chave: cfg.chave, fn, args }), redirect: 'follow', cache: 'no-store' });
    } catch (e) { throw new Error('Sem conexão com a planilha. Verifique a internet.'); }
    let d;
    try { d = await resp.json(); } catch (e) { throw new Error('Resposta inesperada. Confira a URL da ponte em ⚙ → Conexão.'); }
    if (!d.ok) { if (d.auth) telaConexao('Chave inválida. Gere uma nova na planilha (menu Painel) e cole aqui.'); throw new Error(d.erro || 'Erro desconhecido.'); }
    if (d.perfil) S.perfil = d.perfil;
    return d.res;
  }
  function telaConexao(aviso) {
    const c = lerCfg() || {};
    abrirModal(`<div class="hd"><h2>Conectar à planilha</h2>${c.url && c.chave ? '<button class="x" onclick="fecharModal()" aria-label="Fechar">✕</button>' : ''}</div>
      ${aviso ? `<div class="hint" style="color:var(--bad)">${esc(aviso)}</div>` : ''}
      <label for="cUrl">URL da ponte (termina em /exec)</label><input id="cUrl" value="${esc(c.url || '')}" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label for="cChave">Chave do app</label><input id="cChave" type="password" value="${esc(c.chave || '')}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="hint">A chave aparece na planilha, no menu Painel &gt; Gerar nova chave do app. Ela fica guardada só neste celular.</div>
      <button class="btn" id="cSalvar">Conectar</button>
      ${c.url ? '<div class="btnrow"><button class="dang" id="cSair">Desconectar deste celular</button></div>' : ''}`);
    $('cSalvar').onclick = async () => {
      const url = $('cUrl').value.trim(), chave = $('cChave').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return toast('URL inválida. Copie a URL do app da Web, que termina em /exec.', true);
      if (chave.length < 32) return toast('Chave incompleta.', true);
      const ant = lerCfg(); salvarCfg({ url, chave });
      const b = $('cSalvar'); b.disabled = true; b.textContent = 'Testando…';
      try { await run('quemSou'); fecharModal(); toast('Conectado.'); location.reload(); }
      catch (e) { if (ant) salvarCfg(ant); else try { localStorage.removeItem(CFG_KEY); } catch (er) {} b.disabled = false; b.textContent = 'Conectar'; toast(e.message, true); }
    };
    if ($('cSair')) $('cSair').onclick = () => { try { localStorage.removeItem(CFG_KEY); } catch (e) {} location.reload(); };
  }

  // ---------- Topo: mês e totais ----------
  async function carregarMes() {
    const pedido = S.mes;
    try {
      const r = await run('getMonthSummary', pedido);
      if (pedido !== S.mes) return;   // o usuário já trocou de mês
      S.resumo = r; renderTopo(r);
      if (S.aba === 'hist') renderHist(r);
    } catch (e) { toast(e.message, true); }
  }
  function renderTopo(r) {
    $('hMesT').textContent = mesNome(r.comp);
    $('hMesSub').textContent = r.comp === S.mesFoco && S.mesFoco !== S.mesHoje ? 'próxima fatura' : r.comp === S.mesHoje ? 'mês atual'
      : r.situacao === 'Previsto' ? 'previsto' : 'toque para voltar';
    $('hSobra').textContent = fmt(r.sobraSalario);
    $('hSobra').classList.toggle('neg', r.sobraSalario < 0);
    const f = window.innerWidth < 600 ? fmt0 : fmt;   // no celular, sem centavos para caber
    // A conta do topo fecha: (entradas − sobra do vale) + o que a Mariana transfere − o que sai da sua conta = sobra
    const ent = r.entradas - (r.sobraVale || 0), sai = r.despesas - (r.abatimentos || 0);
    $('hEnt').textContent = f(ent);
    $('hSai').textContent = f(sai);
    $('hMarLb').textContent = esp();
    $('hMar').textContent = f(r.repasseLiquido);
    const notas = [];
    if (r.abatimentos) notas.push(`saídas sem os ${fmt(r.abatimentos)} abatidos do repasse`);
    if (r.sobraVale) notas.push(`entradas sem os ${fmt(r.sobraVale)} que sobram no vale`);
    $('hNote').textContent = (notas.length ? 'Valores já ajustados: ' + notas.join('; ') + '. ' : '') + 'Investimentos não entram nesta conta.';
  }
  function mudarMes(k) {
    S.mes = k === 0 ? S.mesFoco : addMes(S.mes, k);
    if (S.perfil === 'esposa') return carregarEsposa();
    $('hMesT').textContent = mesNome(S.mes); $('hMesSub').textContent = 'carregando…';
    if (S.aba === 'hist') $('hist').innerHTML = '<div class="loading">Carregando…</div>';
    carregarMes();
  }

  // ---------- Lançar ----------
  function setTipo(t) {
    S.tipo = t;
    document.querySelectorAll('#segTipo button').forEach(b => b.classList.toggle('on', b.dataset.v === t));
    const i = S.init;
    $('boxCat').classList.toggle('hidden', t === 'Acerto' || t === 'Desconto');
    $('boxParc').classList.toggle('hidden', t !== 'Despesa');
    $('boxMar').classList.toggle('hidden', t !== 'Despesa');
    if (t === 'Receita') preencherSelect($('fCat'), i.categoriasReceita, 'Salário');
    if (t === 'Despesa') preencherSelect($('fCat'), i.categoriasDespesa, i.categoriasDespesa.includes($('fCat').value) ? $('fCat').value : 'Mercado');
    if ((t === 'Receita' || t === 'Acerto') && ehCartao({ meio: $('fMeio').value })) $('fMeio').value = 'Pix/Débito';
    if (t === 'Desconto' && !ehCartao({ meio: $('fMeio').value })) $('fMeio').value = (i.meios.find(m => m.indexOf('Cartão') === 0) || '');
    $('fDesc').placeholder = t === 'Acerto' ? 'Ex.: Mesa, combustível' : t === 'Receita' ? 'Ex.: Salário' : t === 'Desconto' ? 'Desconto com pontos do cartão' : 'Ex.: Bistek';
    atualizarHint();
  }
  function compDe(dataIso, meio) {
    const f = S.init.config.fechamento[meio];
    const [y, m, d] = dataIso.split('-').map(Number);
    let comp = `${y}-${String(m).padStart(2, '0')}-01`;
    if (f && d >= f) comp = addMes(comp, 1);
    return { comp, cartao: !!f };
  }
  function atualizarHint() {
    if (!S.init) return;
    const n = Math.max(1, parseInt($('fParc').value, 10) || 1);
    $('boxModo').classList.toggle('hidden', !(S.tipo === 'Despesa' && n > 1));
    $('boxPct').classList.toggle('hidden', !$('fDiv').checked);
    const podeRep = (S.tipo === 'Despesa' || S.tipo === 'Receita') && n === 1;
    $('boxRep').classList.toggle('hidden', !podeRep);
    if (!podeRep) $('fRep').checked = false;
    const v = parseValor($('fValor').value) || 0, meio = $('fMeio').value, data = $('fData').value;
    let h = '';
    if ((S.tipo === 'Despesa' || S.tipo === 'Desconto') && data) {
      const c = compDe(data, meio);
      if (S.tipo === 'Desconto') h = `Abate ${v ? fmt(v) + ' ' : ''}da fatura de ${mesCurto(c.comp)}.`;
      else {
        h = c.cartao ? `Entra na fatura de ${mesCurto(c.comp)}` : `Entra em ${mesCurto(c.comp)}`;
        const vp = n > 1 && $('fModo').value === 'total' ? v / n : v;
        if (n > 1) h += ` · ${n}x de ${fmt(vp)} até ${mesCurto(addMes(c.comp, n - 1))}`;
        if ($('fDiv').checked && v) h += ` · ${esp()}: ${fmt(vp * ((Number($('fPct').value) || 50) / 100))}${n > 1 ? '/mês' : ''}`;
      }
    } else if (S.tipo === 'Acerto') h = `Valor que a ${esp()} vai te repassar, sem despesa sua.`;
    if ($('fRep').checked) h += (h ? ' · ' : '') + 'Repete todo mês: aparece como previsão nos próximos meses até você parar.';
    $('hint').textContent = h;
  }
  async function salvar() {
    const valor = parseValor($('fValor').value), desc = $('fDesc').value.trim();
    if (!(valor > 0)) return toast('Informe o valor.', true);
    if (!desc && S.tipo !== 'Desconto') return toast('Informe a descrição.', true);
    const btn = $('btnSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      const r = await run('addTransaction', { tipo: S.tipo, data: $('fData').value, descricao: desc, categoria: $('fCat').value, meio: $('fMeio').value,
        valor, modoValor: $('fModo').value, parcelas: $('fParc').value, dividir: $('fDiv').checked, pctMariana: (Number($('fPct').value) || 50) / 100, pago: true, repetir: $('fRep').checked });
      const msg = r.ids.length > 1 ? `${r.ids.length} parcelas salvas (${mesCurto(r.competencias[0])} a ${mesCurto(r.competencias.at(-1))}).` : `Salvo em ${mesCurto(r.competencias[0])}.`;
      toast(msg); $('ultimo').textContent = `Último: ${desc || 'Desconto'} · ${fmt(valor)} · ${msg}`;
      if (desc) { S.init.sugestoes[desc] = { cat: $('fCat').value, meio: $('fMeio').value, mariana: $('fDiv').checked }; atualizarDatalist(); }
      if ($('fRep').checked) toast(msg + ' Vai repetir todo mês.');
      $('fValor').value = ''; $('fDesc').value = ''; $('fParc').value = 1; $('fDiv').checked = false; $('fRep').checked = false; atualizarHint();
      if (r.resumo && r.resumo.comp === S.mes) { S.resumo = r.resumo; renderTopo(r.resumo); }
      $('fValor').focus();
    } catch (e) { toast(e.message || 'Não foi possível salvar.', true); }
    finally { btn.disabled = false; btn.textContent = 'Salvar lançamento'; }
  }
  function atualizarDatalist() {
    $('dlDesc').innerHTML = Object.keys(S.init.sugestoes).sort((a, b) => a.localeCompare(b, 'pt-BR')).map(d => `<option value="${esc(d)}">`).join('');
  }
  function aplicarSugestao() {
    if (!S.init) return;
    const s = S.init.sugestoes[$('fDesc').value.trim()];
    if (!s || S.tipo !== 'Despesa') return;
    if (s.cat && S.init.categoriasDespesa.includes(s.cat)) $('fCat').value = s.cat;
    if (s.meio && S.init.meios.includes(s.meio)) $('fMeio').value = s.meio;
    $('fDiv').checked = !!s.mariana; atualizarHint();
  }

  // ---------- Histórico ----------
  function itemHtml(x, semMeio) {
    const sub = [x.data ? dataBr(x.data).slice(0, 5) : '', x.cat, semMeio ? '' : x.meio, x.parc, x.fixo ? '↻ todo mês' : ''].filter(Boolean).join(' · ');
    const mar = x.mariana && x.cat !== 'Acerto Mariana' ? `<small>${esc(esp())} ${fmt(x.mariana)}</small>` : '';
    const val = x.tipo === 'Receita' ? `<div class="v rec">+${fmt(x.valor)}</div>`
      : x.cat === 'Acerto Mariana' ? `<div class="v rec">+${fmt(x.mariana)}<small>a receber</small></div>`
      : x.valor < 0 ? `<div class="v rec">${fmt(x.valor)}<small>desconto</small></div>`
      : `<div class="v">${fmt(x.valor)}${mar}</div>`;
    return `<div class="item"><button class="dot${x.pago ? ' on' : ''}" data-pago="${esc(x.id)}" aria-label="Pago"></button>
      <div class="main" onclick="editarItem('${esc(x.id)}')"><div class="t">${esc(String(x.desc).replace(/^Acerto Mariana: /, ''))}</div><div class="s">${esc(sub)}</div></div>${val}</div>`;
  }
  function renderHist(r) {
    const it = r.itens || [], soma = a => a.reduce((s, x) => s + x.valor, 0);
    const rec = it.filter(x => x.tipo === 'Receita');
    const desp = it.filter(x => x.tipo === 'Despesa');
    const acertos = desp.filter(x => x.cat === 'Acerto Mariana');
    const resto = desp.filter(x => x.cat !== 'Acerto Mariana');
    const descontos = resto.filter(x => x.valor < 0);
    const cartao = resto.filter(x => ehCartao(x) && x.valor >= 0);
    const fixas = resto.filter(x => x.fixo && !ehCartao(x));
    const vale = resto.filter(x => !x.fixo && !ehCartao(x) && x.meio === 'Vale alimentação' && x.valor >= 0);
    const avulsas = resto.filter(x => !x.fixo && !ehCartao(x) && x.meio !== 'Vale alimentação' && x.valor >= 0);
    const card = (id, titulo, sub, total, corpo) => `<div class="card" id="${id}"><div class="grp-h"><h3>${titulo}</h3>${total !== null ? `<b>${fmt(total)}</b>` : ''}</div>
      ${sub ? `<div class="grp-sub">${sub}</div>` : ''}${corpo}</div>`;
    const prevLinha = x => `<div class="item prev"><div class="main"><div class="t">${esc(x.desc)}</div><div class="s">dia ${x.dia}${x.tipo === 'Despesa' ? ' · ' + esc(x.meio === 'Abatido do repasse' ? 'abatido do repasse' : x.cat) : ''}</div></div>
      <div class="v${x.tipo === 'Receita' ? ' rec' : ''}">${x.tipo === 'Receita' ? '+' : ''}${fmt(x.valor)}</div></div>`;
    const prev = r.fixosPrevistos || [];
    const btnProv = `<div class="btnrow"><button class="pri" onclick="lancarProvisao('${r.comp}')">Lançar provisão de ${MESES[Number(r.comp.slice(5, 7)) - 1]}</button></div>`;
    let html = '';
    // Entradas
    const prevRec = prev.filter(x => x.tipo === 'Receita');
    if (rec.length) html += card('hist-entradas', 'Entradas', '', soma(rec), rec.map(x => itemHtml(x)).join(''));
    else if (prevRec.length) html += card('hist-entradas', 'Entradas (previstas)', 'Ainda não lançadas.', soma(prevRec), prevRec.map(prevLinha).join(''));
    else html += card('hist-entradas', 'Entradas', 'Nenhuma entrada neste mês.', 0, '');
    // Saídas: resumo dos grupos
    html += `<div class="card" id="hist-saidas"><div class="grp-h"><h3>Saídas do mês</h3><b>${fmt(r.despesas)}</b></div>
      <div class="rowv"><span>Gastos fixos</span><b>${fmt(r.fixos)}</b></div>
      <div class="rowv"><span>Cartão de crédito${r.descontos ? ' (já com descontos)' : ''}</span><b>${fmt(r.cartao)}</b></div>
      ${avulsas.length ? `<div class="rowv"><span>Pix, débito e dinheiro</span><b>${fmt(soma(avulsas))}</b></div>` : ''}
      ${vale.length ? `<div class="rowv"><span>Vale-alimentação</span><b>${fmt(soma(vale))}</b></div>` : ''}
      ${r.abatimentos ? `<div class="rowv"><span>− Contas abatidas do repasse da ${esc(esp())}</span><b>${fmt(r.abatimentos)}</b></div>
        <div class="rowv"><span><b>Sai da sua conta</b></span><b>${fmt(r.despesas - r.abatimentos)}</b></div>` : ''}</div>`;
    // Fixos
    if (fixas.length) {
      const aberto = soma(fixas.filter(x => !x.pago && x.meio !== 'Abatido do repasse'));
      html += card('hist-fixos', 'Gastos fixos', aberto ? `Falta pagar ${fmt(aberto)}. Toque no círculo quando pagar e no nome para ajustar o valor.` : 'Todos pagos.', soma(fixas),
        fixas.slice().sort((a, b) => a.pago - b.pago).map(x => itemHtml(x)).join(''));
    } else {
      const pd = prev.filter(x => x.tipo === 'Despesa');
      if (pd.length || prevRec.length) html += card('hist-fixos', 'Gastos fixos (previstos)', 'Lance a provisão para poder ajustar o valor de cada um no mês.', soma(pd), pd.map(prevLinha).join('') + btnProv);
    }
    // Cartão, por cartão
    const porCartao = {};
    resto.filter(x => ehCartao(x)).forEach(x => (porCartao[x.meio] = porCartao[x.meio] || []).push(x));
    const nomes = Object.keys(porCartao);
    if (nomes.length) html += card('hist-cartao', 'Cartão de crédito', 'Faturas deste mês, já com os descontos.', r.cartao, nomes.map((m, k) => {
      const l = porCartao[m].filter(x => x.valor >= 0);
      const f = (r.faturas || []).find(z => z.meio === m) || { total: soma(porCartao[m]), aberto: 0 };
      // A fatura do mês M fecha no dia de fechamento do próprio mês M (compras a partir desse dia vão para M+1)
      const dia = (S.init.config.fechamento || {})[m] || 0;
      const fechaEm = dia ? r.comp.slice(0, 8) + String(dia).padStart(2, '0') : '';
      const st = !f.aberto ? ['paga', 'Paga'] : fechaEm && S.init.hoje >= fechaEm ? ['fechada', 'Fechada'] : ['aberta', 'Aberta'];
      const nome = m.replace('Cartão ', '');
      return `<div class="fat"><div class="fat-h"><div class="fat-ic" style="background:${COR_CAT[(k + 2) % COR_CAT.length]}">${esc(nome.slice(0, 2).toUpperCase())}</div>
          <div class="nm">${esc(nome)}<small>${l.length} compra${l.length === 1 ? '' : 's'}</small></div><b>${fmt(f.total)}</b></div>
        <div class="fat-meta"><div>Fechamento<b>${fechaEm ? dataBr(fechaEm).slice(0, 5) : '–'}</b></div><div>Em aberto<b>${fmt(f.aberto)}</b></div><div>Mês<b>${mesCurto(r.comp)}</b></div></div>
        <div class="fat-f"><span class="badge b-${st[0]}">${st[1]}</span>${f.aberto ? `<button data-fat="${esc(m)}">✓ Registrar pagamento</button>` : ''}</div>
        <details class="fat-l"${nomes.length === 1 ? ' open' : ''}><summary>Ver compras</summary>${l.slice().sort((a, b) => (b.data > a.data ? 1 : -1)).map(x => itemHtml(x, true)).join('')}</details></div>`;
    }).join(''));
    else html += card('hist-cartao', 'Cartão de crédito', 'Nenhuma compra nas faturas deste mês.', 0, '');
    // Orçamento por categoria (tetos da aba Categorias), com a marca de "hoje" no mês corrente
    const orc = (r.categorias || []).filter(c => c.teto > 0);
    if (orc.length) {
      const [y, mm] = r.comp.split('-').map(Number), diasMes = new Date(y, mm, 0).getDate();
      const hojeFrac = r.comp === S.mesHoje ? Number(S.init.hoje.slice(8, 10)) / diasMes : null;
      const tt = orc.reduce((s, c) => s + c.teto, 0), gg = orc.reduce((s, c) => s + c.mes, 0);
      const linhaOrc = (nome, g, t, cor) => { const pc = g / t;
        return `<div class="orc"><div class="top"><span>${esc(nome)}</span><b>${fmt(g)} <span style="color:var(--muted);font-weight:500">de ${fmt(t)}</span></b></div>
          <div class="trk"><i style="width:${Math.min(100, pc * 100)}%;background:${pc > 1 ? 'var(--bad)' : cor}"></i>${hojeFrac !== null ? `<u style="left:${hojeFrac * 100}%" title="hoje"></u>` : ''}</div>
          <div class="sub"><span>${Math.round(pc * 100)}%</span><span class="${t - g < 0 ? 'neg' : 'pos'}">${t - g < 0 ? 'passou ' + fmt(g - t) : 'resta ' + fmt(t - g)}</span></div></div>`; };
      html += card('hist-orc', 'Orçamento do mês', hojeFrac !== null ? 'A marca vertical mostra quanto do mês já passou.' : '', null,
        linhaOrc('Orçamento geral', gg, tt, 'var(--c-acc)') + orc.sort((a, b) => b.mes / b.teto - a.mes / a.teto).map((c, k) => linhaOrc(c.cat, c.mes, c.teto, COR_CAT[k % COR_CAT.length])).join(''));
    }
    if (descontos.length) html += card('hist-descontos', 'Descontos', 'Pontos e estornos que abatem a fatura.', soma(descontos), descontos.map(x => itemHtml(x)).join(''));
    if (avulsas.length) html += card('hist-avulsas', 'Pix, débito e dinheiro', '', soma(avulsas), avulsas.map(x => itemHtml(x)).join(''));
    if (vale.length) html += card('hist-vale', 'Vale-alimentação', r.sobraVale ? `Sobra no vale: ${fmt(r.sobraVale)}` : '', soma(vale), vale.map(x => itemHtml(x, true)).join(''));
    // Mariana
    const ab = resto.filter(x => x.meio === 'Abatido do repasse');
    html += card('hist-mariana', 'Repasse da ' + esc(esp()), 'Parte dela nas despesas divididas, menos as contas abatidas.', r.repasseLiquido,
      `<div class="rowv"><span>Parte dela no mês</span><b>${fmt(r.mariana + (r.abatimentos || 0))}</b></div>`
      + ab.map(x => `<div class="rowv"><span>− ${esc(x.desc)} (abatido)</span><b>${fmt(x.valor)}</b></div>`).join('')
      + `<div class="rowv"><span><b>Ela transfere</b></span><b>${fmt(r.repasseLiquido)}</b></div>`
      + (acertos.length ? `<div class="grp-sub" style="margin-top:8px">Valores avulsos (já incluídos):</div>` + acertos.map(x => itemHtml(x, true)).join('') : ''));
    $('hist').innerHTML = html + `<div class="btnrow" style="margin:-4px 0 12px"><button onclick="telaRecorrentes()">Gastos fixos e salário: valores padrão</button></div>`;
  }
  function itensConhecidos() { return (S.resumo && S.resumo.itens) || []; }
  function editarItem(id) {
    const x = itensConhecidos().find(i => i.id === id); if (!x) return;
    const valor = x.cat === 'Acerto Mariana' ? x.mariana : Math.abs(x.valor);

    const cats = x.tipo === 'Receita' ? S.init.categoriasReceita : S.init.categoriasDespesa;
    const meios = S.init.meios.includes(x.meio) ? S.init.meios : [x.meio].concat(S.init.meios);

    abrirModal(`${hd(String(x.desc).replace(/^Acerto Mariana: /, ''))}
      <div class="hint">${esc([x.cat, x.meio, x.parc ? 'parcela ' + x.parc : '', x.fixo ? 'gasto fixo' : ''].filter(Boolean).join(' · '))}</div>
      <label for="eValor">Valor (R$)</label><input id="eValor" class="valor moeda" inputmode="numeric" value="${num2(valor)}">
      ${x.fixo ? `<div class="toggle"><span>Usar este valor nos próximos meses</span><label class="sw"><input type="checkbox" id="ePadrao"><i></i></label></div>
        <div class="hint">Desligado: muda só este mês (ex.: provisão do aluguel ajustada no fim do mês). Ligado: vira o novo valor padrão.</div>` : ''}
      <label for="eDesc">Descrição</label><input id="eDesc" value="${esc(x.desc)}">
      ${ehAc || ehDesc ? '' : `<div class="two">
        <div><label for="eCat">Categoria</label><select id="eCat">${cats.map(c => `<option${c === x.cat ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label for="eMeio">Pagamento</label><select id="eMeio">${meios.map(m => `<option${m === x.meio ? ' selected' : ''}>${esc(m)}</option>`).join('')}</select></div></div>`}
      <div class="two">

      ${x.fixo ? `<div class="card" style="margin-top:14px"><h3>Repete todo mês</h3>
          <div class="hint" style="margin-top:0">Para parar, escolha a partir de quando. Os meses anteriores continuam como estão.</div>
          <div class="btnrow"><button class="dang" id="eParar">Tirar deste mês e dos próximos</button><button id="eParar2">Manter este mês, tirar dos próximos</button></div></div>`
        : podeRep ? `<div class="btnrow"><button id="eRep">↻ Repetir todo mês</button></div>` : ''}
      <div class="btnrow"><button class="dang" id="eDel">${x.fixo ? 'Excluir só deste mês' : 'Excluir lançamento'}</button></div>`);
    $('eSalvar').onclick = async () => {
      const v = parseValor($('eValor').value);
      if (!(v >= 0)) return toast('Valor inválido.', true);
      const b = $('eSalvar'); b.disabled = true; b.textContent = 'Salvando…';
      try {
        const upd = { valor: v, descricao: $('eDesc').value, pago: $('ePago').checked, atualizarPadrao: !!($('ePadrao') && $('ePadrao').checked) };
        if ($('eCat') && $('eCat').value !== x.cat) upd.categoria = $('eCat').value;
        if ($('eMeio') && $('eMeio').value !== x.meio) upd.meio = $('eMeio').value;
        if (!x.parc && $('eData').value && $('eData').value !== x.data) upd.data = $('eData').value;
        if ($('ePct') && Number($('ePct').value) !== pctAtual) upd.pctMariana = (Number($('ePct').value) || 0) / 100;
        const r = await run('updateTransaction', id, upd);
        if (upd.meio || upd.data) carregarMes();
        fecharModal(); toast('Lançamento atualizado.');
        if (r && r.comp === S.mes) { S.resumo = r; renderTopo(r); renderHist(r); } else carregarMes();
      } catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Salvar'; }
    };
    const avisoMes = () => {
      if (x.parc || ehAc || x.tipo !== 'Despesa' || !$('eMeio')) return;
      const d = $('eData').value || x.data; if (!d) return;
      const c = compDe(d, $('eMeio').value);
      $('eHint').textContent = c.comp !== r0 ? `Vai para ${c.cartao ? 'a fatura de ' : ''}${mesCurto(c.comp)}.` : '';
    };
    const r0 = S.mes;
    if ($('eMeio')) $('eMeio').onchange = avisoMes;
    $('eData').onchange = avisoMes;
    $('eDel').onclick = () => confirmarExclusao(x);
    const parar = async modo => {
      try { const r = await run('pararRecorrente', id, modo); fecharModal();
        toast(modo === 'depois' ? 'Mantido neste mês. Não repete mais nos próximos.' : `Removido deste mês e dos próximos (${r.removidos} lançamento(s)).`);
        carregarMes(); } catch (e) { toast(e.message, true); }
    };
    if ($('eParar')) $('eParar').onclick = () => parar('daqui');
    if ($('eParar2')) $('eParar2').onclick = () => parar('depois');
    if ($('eRep')) $('eRep').onclick = async () => {
      try { const r = await run('tornarRecorrente', id); fecharModal(); toast('Agora repete todo mês. Os próximos meses já mostram a previsão.');
        if (r.comp === S.mes) { S.resumo = r; renderTopo(r); renderHist(r); } else carregarMes(); } catch (e) { toast(e.message, true); }
    };
  }
  function confirmarExclusao(x) {
    abrirModal(`${hd('Excluir lançamento')}<div class="hint">${esc(x.desc)} · ${fmt(Math.abs(x.valor || x.mariana))}</div>
      <div class="btnrow"><button class="dang" id="d1">Excluir só este${x.parc ? ' (parcela ' + esc(x.parc) + ')' : ''}</button>
      ${x.compra ? '<button class="dang" id="d2">Excluir todas as parcelas</button>' : ''}<button onclick="fecharModal()">Cancelar</button></div>`);
    const exec = async todas => {
      try { const r = await run('deleteTransaction', x.id, todas); fecharModal(); toast(r.removidos + ' lançamento(s) excluído(s).'); carregarMes(); }
      catch (e) { toast(e.message, true); }
    };
    $('d1').onclick = () => exec(false);
    if ($('d2')) $('d2').onclick = () => exec(true);
  }
  async function lancarProvisao(comp) {
    try {
      const r = await run('gerarFixasMes', comp);
      toast(r.ok ? 'Provisão lançada. Toque em cada gasto fixo para ajustar o valor do mês.' : r.msg);
      if (r.resumo && comp === S.mes) { S.resumo = r.resumo; renderTopo(r.resumo); renderHist(r.resumo); }
    } catch (e) { toast(e.message, true); }
  }

  // ---------- Gastos fixos e salário (valores padrão) ----------
  async function telaRecorrentes(lista) {
    abrirModal(`${hd('Gastos fixos e salário')}<div class="hint">Valores padrão usados a cada mês. Para mudar só um mês, toque no lançamento no Histórico.</div><div id="recs"><div class="loading">Carregando…</div></div>`);
    try { lista = lista || await run('getRecorrentes'); } catch (e) { return toast(e.message, true); }
    S.recs = lista; if (!$('recs')) return;
    const linha = x => `<div class="item${x.ativo ? '' : ' prev'}"><div class="main" onclick="formRecorrente(${x.row})"><div class="t">${esc(x.desc)}</div>
      <div class="s">${esc([x.tipo === 'Receita' ? 'entrada' : x.cat, x.meio, 'dia ' + x.dia, x.pct ? esp() + ' ' + Math.round(x.pct * 100) + '%' : '', x.fim ? 'até ' + mesCurto(x.fim) : '', x.ativo ? '' : 'pausada'].filter(Boolean).join(' · '))}</div></div>
      <div class="v${x.tipo === 'Receita' ? ' rec' : ''}">${x.tipo === 'Receita' ? '+' : ''}${fmt(x.valor)}</div></div>`;
    const rec = lista.filter(x => x.tipo === 'Receita'), des = lista.filter(x => x.tipo !== 'Receita');
    $('recs').innerHTML = `<div class="card"><h3>Entradas fixas</h3>${rec.map(linha).join('') || '<div class="hint">Nenhuma.</div>'}
        <div class="btnrow"><button onclick="formRecorrente(0,'Receita')">+ Nova entrada fixa</button></div></div>
      <div class="card"><h3>Gastos fixos</h3>${des.map(linha).join('') || '<div class="hint">Nenhum.</div>'}
        <div class="btnrow"><button onclick="formRecorrente(0,'Despesa')">+ Novo gasto fixo</button></div></div>`;
  }
  function formRecorrente(row, tipoNovo) {
    const x = row ? S.recs.find(r => r.row === row) : { desc: '', tipo: tipoNovo, cat: tipoNovo === 'Receita' ? 'Salário' : 'Moradia', meio: 'Pix/Débito', valor: 0, dia: 1, pct: 0, inicio: S.mes, fim: '', ativo: true };
    const cats = x.tipo === 'Receita' ? S.init.categoriasReceita : S.init.categoriasDespesa;
    abrirModal(`${hd(row ? x.desc : (x.tipo === 'Receita' ? 'Nova entrada fixa' : 'Novo gasto fixo'))}
      <label for="rDesc">Descrição</label><input id="rDesc" value="${esc(x.desc)}">
      <label for="rValor">Valor padrão (R$)</label><input id="rValor" class="valor moeda" inputmode="numeric" value="${num2(x.valor)}">
      <div class="two">
        <div><label for="rCat">Categoria</label><select id="rCat">${cats.map(c => `<option${c === x.cat ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label for="rMeio">Pagamento</label><select id="rMeio">${S.init.meios.map(m => `<option${m === x.meio ? ' selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
      </div>
      <div class="two">
        <div><label for="rDia">Dia</label><input id="rDia" type="number" inputmode="numeric" min="1" max="28" value="${x.dia}"></div>
        ${x.tipo === 'Receita' ? '<div></div>' : `<div><label for="rPct">Parte da ${esc(esp())} (%)</label><input id="rPct" type="number" inputmode="numeric" min="0" max="100" value="${Math.round(x.pct * 100)}"></div>`}
      </div>
      ${x.tipo === 'Receita' ? '' : `<div class="hint">Use o pagamento "Abatido do repasse" para contas que você paga descontando do repasse dela (luz, internet).</div>`}
      <div class="two">
        <div><label for="rIni">Começa em</label><input id="rIni" type="month" value="${(x.inicio || S.mes).slice(0, 7)}"></div>

      </div>

      <button class="btn" id="rSalvar">Salvar</button>
      <div class="btnrow"><button onclick="telaRecorrentes(S.recs)">Voltar</button>${row ? `<button class="dang" id="rDel">Excluir</button>` : ''}</div>`);
    $('rSalvar').onclick = async () => {

        toast('Salvo. Vale a partir da próxima provisão.'); telaRecorrentes(l);
      } catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Salvar'; }

    if ($('rDel')) $('rDel').onclick = async () => {
      try { telaRecorrentes(await run('deleteRecorrente', row)); toast('Excluído. Os lançamentos já feitos continuam.'); } catch (e) { toast(e.message, true); }

  // ---------- Investimentos ----------
  const TIPOS = ['Reserva', 'Renda fixa', 'Ação', 'FII', 'Outro'];
  const TIPOS_TIT = { 'Reserva': 'Reserva de emergência', 'Renda fixa': 'Renda fixa', 'Ação': 'Ações', 'FII': 'Fundos imobiliários', 'Outro': 'Outros' };
  async function abrirInv() {
    try { const [d, m] = await Promise.all([run('getInvestimentos'), run('getMovimentacoes', '')]); S.movsTodas = m; renderInv(d); }
    catch (e) { toast(e.message, true); }
  }
  // Recarrega o histórico depois de salvar ou excluir uma movimentação
  function atualizarHistInv() { run('getMovimentacoes', '').then(m => { S.movsTodas = m; if (S.inv && S.aba === 'inv') renderInv(S.inv); }).catch(() => {}); }
  const OP_GRUPO = { 'Aplicação': 'entradas', 'Compra': 'entradas', 'Resgate': 'resgates', 'Venda': 'resgates', 'Provento': 'proventos', 'Atualização de saldo': 'saldo' };
  function histMovHtml(d, p) {
    if (!S.movsTodas) return '';
    const dono = a => a.titular === 'Conjunta' ? 'conj' : a.titular === d.esposa ? 'esposa' : 'eu';
    const daPessoa = S.movsTodas.filter(m => {
      const a = d.ativos.find(x => x.id === m.ativoId); if (!a) return false;
      const o = dono(a); return o === 'conj' ? (m.quem === d.esposa ? 'esposa' : 'eu') === p : o === p;
    });
    if (!daPessoa.length) return '';
    const f = S.filtroMov, l = daPessoa.filter(m => f === 'todas' || OP_GRUPO[m.op] === f);
    const soma = g => daPessoa.filter(m => OP_GRUPO[m.op] === g).reduce((s, m) => s + m.valor, 0);
    const vis = S.movTudo ? l : l.slice(0, 15);
    const fm = window.innerWidth < 600 ? fmt0 : fmt;
    const chip = (k, t) => `<button data-fmov="${k}" class="${f === k ? 'on' : ''}">${t}</button>`;
    return `<div class="card" id="inv-hist"><h3>Histórico de movimentações</h3>
      <div class="split" style="margin:4px 0 10px"><div>Aplicado<b>${fm(soma('entradas'))}</b></div><div>Resgatado<b>${fm(soma('resgates'))}</b></div><div>Proventos<b>${fm(soma('proventos'))}</b></div></div>
      <div class="chips">${chip('todas', 'Todas')}${chip('entradas', 'Aplicações')}${chip('resgates', 'Resgates')}${chip('proventos', 'Proventos')}</div>
      ${vis.map(m => { const sai = OP_GRUPO[m.op] === 'resgates', sal = m.op === 'Atualização de saldo';
        return `<div class="item"><div class="main" onclick="S.movs=S.movsTodas;formMov('${m.ativoId}','${m.op}','${m.id}')"><div class="t">${esc(m.ativo)}</div>
          <div class="s"><span class="tag">${esc(m.op)}</span>${dataBr(m.data)}${m.qtd ? ' · ' + m.qtd + ' un.' : ''}${m.obs ? ' · ' + esc(m.obs) : ''}</div></div>
          <div class="v${sai || sal ? '' : ' rec'}">${sai ? '-' : sal ? '=' : '+'}${fmt(m.valor)}</div></div>`; }).join('') || '<div class="hint">Nada neste filtro.</div>'}
      ${l.length > vis.length ? `<div class="btnrow"><button data-movtudo="1">Mostrar todas (${l.length})</button></div>` : ''}</div>`;
  }
  // Parte de uma pessoa ('eu' ou 'esposa') em um ativo; null se não for dela
  function parte(a, p) {
    const dono = a.titular === 'Conjunta' ? 'conj' : a.titular === S.inv.esposa ? 'esposa' : 'eu';
    if (dono !== 'conj' && dono !== p) return null;
    const valor = dono === 'conj' ? (a[p] || 0) : a.valor;
    const aplicado = dono === 'conj' ? (p === 'eu' ? a.aplicadoEu : a.aplicadoEsposa) : a.investido;
    const fator = a.valor ? valor / a.valor : 0;
    return { valor, aplicado: aplicado || 0, rend: valor - (aplicado || 0) + (dono === 'conj' ? 0 : a.proventos || 0),
             liquido: (a.liquido || a.valor) * fator, conj: dono === 'conj', pct: fator };
  }
  function renderInv(d) {
    S.inv = d;
    if (d.avisoCdi) toast(d.avisoCdi, true);

  const kfmt = v => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1000 ? (a / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : Math.round(a)); };
  const mesAbrev = ym => { const [y, m] = ym.split('-').map(Number); return MESES[m - 1].slice(0, 3) + (m === 1 ? '/' + String(y).slice(2) : ''); };
  function colunas(dados, series) {
    const W = 340, H = 170, pl = 30, pb = 22, pt = 12;
    const vals = dados.flatMap(d => series.map(s => d[s.key]));
    const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
    const y = v => pt + (max - v) / (max - min) * (H - pt - pb);
    const slot = (W - pl) / dados.length, bw = Math.min(14, (slot - 4) / series.length);
    let g = '';
    [max, (max + min) / 2, min].forEach(t => g += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl - 4}" y="${y(t) + 3}" text-anchor="end">${kfmt(t)}</text>`);
    dados.forEach((d, i) => {
      const x0 = pl + i * slot + (slot - bw * series.length) / 2;
      series.forEach((s, j) => {
        const v = d[s.key], cor = typeof s.cor === 'function' ? s.cor(v) : s.cor;
        const ya = y(Math.max(v, 0)), yb = y(Math.min(v, 0));
        g += `<rect x="${x0 + j * bw}" y="${ya}" width="${Math.max(1, bw - 1.5)}" height="${Math.max(1, yb - ya)}" rx="2" fill="${cor}" opacity="${d.prev ? .5 : 1}"><title>${esc(s.nome || '')} ${fmt(v)}</title></rect>`;
      });
      if (dados.length <= 13 || i % 2 === 0) g += `<text x="${pl + i * slot + slot / 2}" y="${H - 6}" text-anchor="middle">${mesAbrev(d.comp)}</text>`;
    });
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
  }

    if (t === 'livre') return { de: S.per.de, ate: S.per.ate };
    return { de: addMes(fim, -(Number(t) - 1)), ate: fim };
  }

  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

  (async function iniciar() {
    if (!lerCfg()) { $('hMesT').textContent = 'Bem-vindo'; telaConexao(); return; }
    try {
      const q = await run('quemSou');
      if (q && q.perfil === 'esposa') return iniciarEsposa(q);
      const i = await run('getInitData');
      S.init = i;
      document.querySelectorAll('.nmEsp').forEach(e => e.textContent = esp());
      // Mês em foco: o da próxima fatura (depois do fechamento do cartão, já é o mês seguinte)
      S.mesHoje = i.hoje.slice(0, 8) + '01';
      const cart = i.meios.find(m => i.config.fechamento[m]);
      const fech = cart ? i.config.fechamento[cart] : 5;
      S.mesFoco = Number(i.hoje.slice(8, 10)) >= fech ? addMes(S.mesHoje, 1) : S.mesHoje;
      S.mes = S.mesFoco;
      $('fData').value = i.hoje;
      $('fPct').value = Math.round(i.config.pctMariana * 100);
      $('pDe').value = addMes(S.mesHoje, -5).slice(0, 7); $('pAte').value = S.mesHoje.slice(0, 7);
      preencherSelect($('fCat'), i.categoriasDespesa, 'Mercado');
      preencherSelect($('fMeio'), i.meios, cart || i.meios[0]);
      atualizarDatalist(); setTipo('Despesa');
      carregarMes();
    } catch (e) { toast('Erro ao carregar: ' + e.message, true); }
  })();
</script>
</body>
</html>
